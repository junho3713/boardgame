<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차그녀 온라인 연결 시험</title><style>:root{font:16px/1.8 system-ui,sans-serif;color:#202333;background:#f7f8fc}main{max-width:680px;margin:40px auto;padding:20px}h1{font-size:28px;line-height:1.4}label{display:block;margin-top:14px}input,button{font:inherit;padding:10px 14px;border:1px solid #c6c9dc;border-radius:7px;min-height:44px;box-sizing:border-box}input{width:100%;background:white}button{margin-top:14px;background:#4338ca;color:white;cursor:pointer}button:disabled{background:#686a79;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #4338ca;outline-offset:3px}.notice{background:#eeedfa;padding:15px;border-radius:8px}.hand article{border-bottom:1px solid #dfe1eb;padding:14px 0}.hand h3{margin:0}.hand p{margin:5px 0}#status{color:#822635}code{font-size:24px;letter-spacing:.12em}small{color:#565c70}#room[hidden],#entry[hidden]{display:none}</style><main><h1>차그녀 온라인 연결 시험</h1><p class="notice">방 만들기·친구 입장·개인 손패 분리를 확인하는 시험 화면이에요. 아직 차그녀의 특기·조합·의혹을 진행하는 게임은 아니에요.</p><section id="entry"><label for="name">내 이름</label><input id="name" maxlength="16" autocomplete="nickname"><button id="create">새 방 만들기</button><label for="code">친구가 알려준 방 코드</label><input id="code" maxlength="8" autocapitalize="characters" autocomplete="off"><button id="join">코드로 입장</button></section><p id="status" role="status"></p><section id="room" hidden><h2>방 코드 <code id="roomCode"></code></h2><p>같은 서버 주소와 이 코드를 친구에게 알려주세요.</p><ul id="players"></ul><button id="deal">3명 이상 모이면 시험 카드 나눠주기</button><p id="guide"></p><h2>나만 볼 수 있는 손패</h2><div id="hand" class="hand"></div><button id="leave">시험 화면 나가기</button></section><p><small>무료 서버 시험용입니다. 방은 최대 2시간 유지되며 서버가 재시작하면 사라집니다. 무료 서버가 잠들어 있으면 첫 연결이 늦어질 수 있어요.</small></p></main><script>
'use strict';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('girl-test-token')||'',timer;function node(tag,text){const e=document.createElement(tag);e.textContent=text;return e;}
async function api(route,body){const r=await fetch('/api/'+route,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'연결하지 못했어요. 다시 시도해 주세요.');return data;}
function render(s){$('entry').hidden=true;$('room').hidden=false;$('roomCode').textContent=s.code;$('players').replaceChildren(...s.players.map(p=>node('li',p.name+(p.id===s.me?' (나)':'')+(p.id===s.host?' · 방장':'')+` · 손패 ${p.cards}장`)));$('deal').hidden=s.phase!=='lobby'||s.me!==s.host;$('deal').disabled=s.players.length<3;$('guide').textContent=s.phase==='lobby'?'입장을 기다리는 중이에요.':'카드를 받았어요. 다른 참가자의 손패는 전송하지 않아요.';$('hand').replaceChildren(...s.hand.map(c=>{const a=document.createElement('article');a.append(node('h3',`${c.name} · MP ${c.mp}`),node('p',c.ability),node('p','마지막 정체: '+c.win));return a;}));}
async function enter(route){try{$('status').textContent='연결 중이에요…';const d=await api(route,{name:$('name').value,code:$('code').value});token=d.token;sessionStorage.setItem('girl-test-token',token);render(d.state);$('status').textContent='';poll();}catch(e){$('status').textContent=e.message;}}
function poll(){clearTimeout(timer);timer=setTimeout(async()=>{try{render(await api('state'));$('status').textContent='';}catch(e){$('status').textContent=e.message;}poll();},4000);}
$('create').onclick=()=>enter('rooms');$('join').onclick=()=>enter('join');$('deal').onclick=async()=>{try{render(await api('deal',{}));}catch(e){$('status').textContent=e.message;}};$('leave').onclick=()=>{sessionStorage.removeItem('girl-test-token');location.reload();};if(token)api('state').then(s=>{render(s);poll();}).catch(()=>{token='';sessionStorage.removeItem('girl-test-token');});
</script></html>
